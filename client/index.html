        {"@type": "Question", "name": "¿Qué es Barkley Online?", "acceptedAnswer": {"@type": "Answer", "text": "Colegio 100% asincrónico en Chile (también llamado homeschool estructurado). Sin clases en vivo, sin horarios fijos. Cada lección incluye video y pódcast. Preparación oficial para exámenes libres ante el MINEDUC, de 1° básico a 4° medio."}},
        {"@type": "Question", "name": "¿Barkley es un colegio acreditado por el MINEDUC?", "acceptedAnswer": {"@type": "Answer", "text": "No. Ningún colegio 100% online está acreditado como colegio por el MINEDUC en Chile. La vía oficial es Exámenes Libres, que administra el propio Ministerio. Barkley prepara para rendirlos; no los administra ni entrega la certificación."}},
        {"@type": "Question", "name": "¿Cuál es la diferencia entre Barkley y un examen libre?", "acceptedAnswer": {"@type": "Answer", "text": "Examen libre = solo la prueba ante el MINEDUC, sin colegio. Barkley = colegio que te prepara para el examen: video + pódcast por lección, tutor que acompaña, plataforma con Aprendizaje por Dominio. Pagas por acceso a la plataforma + acompañamiento, no por la certificación (eso es gratis en MINEDUC)."}},
        {"@type": "Question", "name": "¿Qué es Aprendizaje por Dominio (Umbral™)?", "acceptedAnswer": {"@type": "Answer", "text": "Sistema que no deja avanzar sin dominar. Cada unidad se desbloquea recién al aprobar la anterior con 70%+. Puedes repetir la evaluación. Resultado: nadie arrastra vacíos. Presencial: todos avanzan por calendario (algunos quedan). Online Barkley: solo avanzas si demostraste dominio."}},
        {"@type": "Question", "name": "¿Hay clases en vivo en Barkley?", "acceptedAnswer": {"@type": "Answer", "text": "No. 100% asincrónico: video y pódcast grabados. Tú los ves cuando quieras. Tutor está disponible para preguntas vía chat/email, no horario fijo de clase en vivo."}},
        {"@type": "Question", "name": "¿Cuánto cuesta Barkley?", "acceptedAnswer": {"@type": "Answer", "text": "$65.000 CLP/mes. Incluye acceso a plataforma + video + pódcast + tutor + Programa Adaptativo. En 4° medio incluye el preuniversitario PAES. Costo fijo igual para todos, con o sin necesidades especiales, con o sin flexibilidad requerida."}},
        {"@type": "Question", "name": "¿Barkley funciona para estudiantes con TDAH?", "acceptedAnswer": {"@type": "Answer", "text": "Sí. Programa Adaptativo suma: bloques cortos de contenido, agenda visible, lectura en voz, pausas automáticas. Horario flexible significa: puedes estudiar cuando mejor funciona tu cerebro, no cuando el calendario lo dice. TDAH + presencial es presión constante; TDAH + Barkley es ritmo propio."}},
        {"@type": "Question", "name": "¿Funciona para estudiantes con dislexia?", "acceptedAnswer": {"@type": "Answer", "text": "Sí. Programa Adaptativo ofrece: tipografía diseñada para dislexia, pódcast (escucha en vez de leer), lectura en voz, líneas de espaciado generoso. Barkley suma flexibilidad de ritmo, sin presión de 'ir al ritmo del curso'."}},
        {"@type": "Question", "name": "¿Barkley sirve para estudiantes con movilidad reducida?", "acceptedAnswer": {"@type": "Answer", "text": "Sí. Elimina presión de desplazamiento — estudias desde casa. Programa Adaptativo: navegación por teclado, sin necesidad de ratón, interfaz accesible WCAG 2.1 Level AA. Si usas switch o control por voz, avisas en admisiones para testear compatibilidad."}},
        {"@type": "Question", "name": "¿Sirve para estudiantes con enfermedad crónica?", "acceptedAnswer": {"@type": "Answer", "text": "Depende del ciclo de la enfermedad. Si tienes ventanas predecibles de bienestar, eso es tiempo de estudio real. Cero faltas, cero justificantes médicos, cero presión de ponerse al día en fecha fija — la plataforma espera. Si la enfermedad es muy impredecible, conviene conversar honestamente en admisiones antes de inscribir."}},
        {"@type": "Question", "name": "¿Funciona si viajo constantemente?", "acceptedAnswer": {"@type": "Answer", "text": "Sí, completamente. 100% asincrónico = no hay horario fijo. Hoy Santiago, mañana Bangkok — la plataforma sigue donde la dejaste. Una sola inscripción cubre todo el año. Examen final se rinde en centro acreditado del país donde estés."}},
        {"@type": "Question", "name": "¿Funciona si trabajo mientras estudio?", "acceptedAnswer": {"@type": "Answer", "text": "Sí. Horario flexible: estudias después del trabajo si quieres, temprano, fines de semana. Ritmo propio significa: tú controlas cuándo estudiar, no un calendario externo."}},
        {"@type": "Question", "name": "¿Presencial o online? ¿Cuál es mejor?", "acceptedAnswer": {"@type": "Answer", "text": "Depende del estudiante. Presencial: estructura fija, deportes en vivo, socialización diaria. Online: flexibilidad, ritmo propio, sin presión de desplazamiento. No hay 'mejor en general', hay mejor-para-tu-hijo."}},
        {"@type": "Question", "name": "¿El online tiene socialización?", "acceptedAnswer": {"@type": "Answer", "text": "Pierdes la socialización forzada del aula (recreos, pasillos, grupo cerrado todos los días). No pierdes socialización en general — actividades externas, deportes, amigos elegidos. La diferencia: socialización no impuesta por estructura del curso."}},

        {"@type": "Question", "name": "¿Qué nivel de certeza tienes en que pasaré el examen?", "acceptedAnswer": {"@type": "Answer", "text": "Barkley no garantiza aprobación — eso depende del estudiante, del esfuerzo, de las circunstancias reales. Lo que sí ofrece: curriculum oficial MINEDUC estructurado, Aprendizaje por Dominio (no arrastra vacíos), tutor que monitorea, plataforma con video + pódcast. El resto depende de ti."}},
        {"@type": "Question", "name": "¿Puedo estudiar en Barkley viviendo fuera de Chile?", "acceptedAnswer": {"@type": "Answer", "text": "Sí. Completamente. Zona horaria no importa (100% asincrónico). Internet es lo único que necesitas. Examen final lo rindes en institución acreditada para Exámenes Libres en el país donde vivas."}},
        {"@type": "Question", "name": "¿La licencia es válida en Chile si estudio desde el extranjero?", "acceptedAnswer": {"@type": "Answer", "text": "Sí. Validez viene del Examen Libre MINEDUC, no del colegio. Estudies desde Madrid, Miami o Singapur — rindes ante MINEDUC (vía institución acreditada en tu país) y obtienes licencia de enseñanza media oficial de Chile, idéntica a la de un colegio presencial."}},
        {"@type": "Question", "name": "¿Qué pasa si me mudo durante el año?", "acceptedAnswer": {"@type": "Answer", "text": "Cero problema. Colegio online funciona igual en cualquier lugar. Si te mudas a otro país, buscar centro examinador acreditado — Barkley te ayuda con ese trámite. Si te mudas dentro de Chile, nada cambia en la plataforma."}},
        {"@type": "Question", "name": "¿Necesito que un adulto me acompañe si soy menor?", "acceptedAnswer": {"@type": "Answer", "text": "En Exámenes Libres de básica (1-8), sí: requiere Adulto Acompañante en la prueba ante MINEDUC (puede ser papá, mamá, tutor legal, otro adulto). En media (1-4 medio), no se requiere — puedes rendir solo. En Barkley mismo, puedes estudiar sin adulto presente — la plataforma es accesible, tutor acompaña remotamente."}},
        {"@type": "Question", "name": "¿Qué pasa si repruebo un examen libre?", "acceptedAnswer": {"@type": "Answer", "text": "Puedes repetir en siguiente período disponible. MINEDUC abre 3 períodos al año para menores de 18. Si reprobaste, registrarse en admisiones para siguiente período, volver a estudiar, volver a presentarse."}},
