    <!-- Carga no-bloqueante: el <link rel="stylesheet"> normal detiene el
         renderizado hasta que la hoja de Google Fonts termina de descargar.
         Con media="print" el navegador la baja en paralelo sin bloquear, y el
         onload la activa para pantalla — ahorro medido en PageSpeed: ~1s de LCP. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,wght@0,400..700;1,400..700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet"></noscript>
    <!-- Precarga la foto del hero: es el elemento LCP y sin esto solo empieza
         a descargarse cuando React monta, ya con el JS descargado y ejecutado. -->
    <!-- href apunta al 900w, no al original: los navegadores que ignoran
         imagesrcset (Safari antiguo) precargarían el de 1800px y después el
         <img> elegiría igual el de 900px — doble descarga en móvil, justo lo
         que esta optimización busca evitar. -->
    <link rel="preload" as="image" href="/images/hero-estudiante-900.webp"
          imagesrcset="/images/hero-estudiante-900.webp 900w, /images/hero-estudiante-1400.webp 1400w, /images/hero-estudiante.webp 1800w"
          imagesizes="(max-width: 760px) 100vw, 70vw" fetchpriority="high">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!--Start of Tawk.to Script-->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    
    // Configuración personalizada en español
    Tawk_API.customStyle = {
      visibility : {
        desktop : {
          position : 'br',
          xOffset : 20,
          yOffset : 20
        },
        mobile : {
          position : 'br',
          xOffset : 10,
          yOffset : 10
        }
      }
    };
    
    // Mensaje de bienvenida personalizado
    Tawk_API.onLoad = function(){
      console.log('Tawk.to cargado - Configurando en español');
      
      // Personalizar nombre del agente
      Tawk_API.setAttributes({
        'name': 'Asistente Virtual Barkley'
      }, function(error){
        if (!error) {
          console.log('Nombre del agente configurado');
        }
      });

      // Agregar evento de bienvenida personalizado
      Tawk_API.addEvent('visit', {
        message: '¡Hola! 👋 Bienvenido a Barkley'
      }, function(error){
        if (!error) {
          console.log('Mensaje de bienvenida enviado');
        }
      });
    };
    
    // Configurar visitante
    Tawk_API.onBeforeLoad = function(){
      Tawk_API.visitor = {
        name : 'Visitante'
      };
    };
    
    // Mensaje cuando el chat se maximiza
    Tawk_API.onChatMaximized = function(){
      console.log('Chat maximizado');
    };
    
    // El widget completo pesa ~120KB de JS y consumía tiempo de bloqueo del
    // hilo principal justo cuando el usuario recién puede ver e interactuar
    // con la página (confirmado con Lighthouse: 84KB de ese bundle sin usar
    // en la carga inicial). Nadie abre el chat en el primer segundo, así que
    // se difiere: primera interacción real (scroll/mouse/touch) o, si no hay
    // ninguna, a los 4s igual — nunca deja de cargar, solo deja de competir
    // por el hilo principal con el contenido que sí importa al abrir.
    function cargarTawk(){
      var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
      s1.async=true;
      s1.src='https://embed.tawk.to/697ac2c6111a7519800fd43a/1jgie78i8?v=' + new Date().getTime();
      s1.charset='UTF-8';
      s1.setAttribute('crossorigin','*');
      s0.parentNode.insertBefore(s1,s0);
    }
    (function(){
      var cargado = false;
      function iniciar(){
        if (cargado) return;
        cargado = true;
        ['scroll','mousemove','touchstart','keydown'].forEach(function(ev){
          window.removeEventListener(ev, iniciar);
        });
        clearTimeout(temporizador);
        cargarTawk();
      }
      ['scroll','mousemove','touchstart','keydown'].forEach(function(ev){
        window.addEventListener(ev, iniciar, { once: true, passive: true });
      });
      var temporizador = setTimeout(iniciar, 4000);
    })();
    </script>
    <!--End of Tawk.to Script-->
  </body>
