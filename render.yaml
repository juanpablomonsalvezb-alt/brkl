services:
  - type: web
    name: brkl
    env: node
    region: oregon
    plan: free
    # Migraciones y seeds NO corren en el build: son operaciones manuales que exigen revisión,
    # respaldo y aprobación explícita (ver scripts/migrate-production.ts y scripts/seed-production.ts).
    buildCommand: npm install && npm run build
    startCommand: node dist/index.cjs
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
